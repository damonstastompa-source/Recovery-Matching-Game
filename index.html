<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101318">
  <title>Recovery Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">RECOVERY GAME</div>
        <h1>Recovery Match</h1>
        <p class="subtitle">Match each recovery term with its definition.</p>
      </div>
      <button id="newGameTop" class="icon-btn" aria-label="New game" title="New game">↻</button>
    </header>

    <section class="controls">
      <div class="mode-group" aria-label="Board size">
        <button class="mode active" data-size="4">4×4</button>
        <button class="mode" data-size="6">6×6</button>
        <button class="mode" data-size="8">8×8</button>
      </div>
      <div class="deck-row">
        <label for="deckSelect">DECK</label>
        <select id="deckSelect" aria-label="Recovery deck">
          <option>Mixed</option>
          <option>Recovery Basics</option>
          <option>Steps</option>
          <option>Spiritual Principles</option>
          <option>Emotions &amp; Patterns</option>
          <option>Fellowship &amp; Service</option>
          <option>Recovery Language</option>
        </select>
      </div>

      <div class="stats">
        <div class="stat"><span>TIME</span><strong id="timer">00:00</strong></div>
        <div class="stat"><span>MATCHES</span><strong id="matches">0/8</strong></div>
        <div class="stat"><span>SCORE</span><strong id="score">0</strong></div>
        <div class="stat"><span>STREAK</span><strong id="streak">0</strong></div>
      </div>
    </section>

    <section class="game-wrap">
      <div id="board" class="board size-4" aria-label="Matching game board"></div>
    </section>

    <div id="message" class="message" role="status">
      Find the matching term and definition.
    </div>

    <section class="actions">
      <button id="newGame" class="primary">New Game</button>
      <button id="study" class="secondary">Study Terms</button>
    </section>
  </main>

  <div id="winModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal-card">
      <div class="win-mark">✓</div>
      <div class="eyebrow">BOARD COMPLETE</div>
      <h2 id="winTitle">Nice work.</h2>
      <p id="winSummary"></p>
      <div class="results">
        <div><span>TIME</span><strong id="finalTime">00:00</strong></div>
        <div><span>SCORE</span><strong id="finalScore">0</strong></div>
        <div><span>BEST</span><strong id="finalBest">0</strong></div>
      </div>
      <button id="playAgain" class="primary wide">Play Again</button>
    </div>
  </div>

  <div id="studyModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="studyTitle">
    <div class="modal-card study-card">
      <button class="close" id="closeStudy" aria-label="Close">×</button>
      <div class="eyebrow">STUDY MODE</div>
      <h2 id="studyTitle">Recovery Terms</h2>
      <div id="studyList" class="study-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
